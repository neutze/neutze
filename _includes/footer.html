<footer class="site-footer">
  <div class="wrapper">
    <p class="footer-links">
      © {{ site.time | date: "%Y" }} {{ site.title | escape }} ·
      {%- for entry in site.minima.social_links %}
      <a rel="me" href="{{ entry.url }}">{{ entry.title }}</a> ·
      {%- endfor %}
      <a href="{{ site.feed.path | default: 'feed.xml' | relative_url }}">Feed</a> ·
      <a href="{{ '/datenschutz/' | relative_url }}">Privacy</a>
    </p>
  </div>
</footer>
